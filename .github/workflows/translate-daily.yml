name: Translate daily digests

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '默认仅检查；translate 需要启用仓库变量'
        type: choice
        default: dry-run
        options:
          - dry-run
          - translate
  push:
    branches: [main, docs/readme-en-ja]
    paths:
      - '.github/workflows/translate-daily.yml'
      - 'scripts/**'
      - 'docs/translations.md'
      - 'README.en.md'
      - 'README.ja.md'
      - 'translations/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: translate-daily-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'

jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      model_changed: ${{ steps.model-plan.outputs.changed }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Plan against upstream without inference or writes
        run: python scripts/run_translation_workflow.py --mode dry-run
      - name: Check whitespace
        run: git diff --check
      - name: Plan real model checks for inference changes
        id: model-plan
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          import os
          import subprocess
          parent = subprocess.run(['git', 'rev-parse', '--verify', 'HEAD^1'],
                                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          diff = (['git', 'diff', '--name-only', 'HEAD^1', 'HEAD'] if parent.returncode == 0 else
                  ['git', 'diff-tree', '--root', '--no-commit-id', '--name-only', '-r', 'HEAD'])
          changed = set(subprocess.check_output(diff, text=True).splitlines())
          inference = {'scripts/translate_daily.py', 'scripts/run_translation_workflow.py', 'scripts/smoke_translation.py'}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('changed=' + str(bool(changed & inference)).lower() + '\n')
          PY

  publish:
    needs: validate
    if: >-
      github.event.repository.private == false &&
      github.ref_name == github.event.repository.default_branch &&
      vars.TRANSLATION_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode == 'translate'))
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TRANSLATION_ENABLED: ${{ vars.TRANSLATION_ENABLED }}
      TRANSLATION_REPOSITORY_PUBLIC: 'true'
      TRANSLATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Translate locally, verify source, then publish
        run: python scripts/run_translation_workflow.py --mode translate --publish

  model-smoke:
    needs: validate
    if: github.event.repository.private == false && github.event_name == 'push' && needs.validate.outputs.model_changed == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TRANSLATION_REPOSITORY_PUBLIC: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check real English and Japanese model samples without publishing
        run: python scripts/smoke_translation.py
